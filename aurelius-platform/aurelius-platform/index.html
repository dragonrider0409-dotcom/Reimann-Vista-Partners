<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurelius</title>
<meta name="description" content="Quantitative risk, regime, volatility, validation and execution models behind one API, with an analyst agent that shows its work.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M3 22V11a9 9 0 0 1 18 0v11h-5.5V12.2a3.5 3.5 0 0 0-7 0V22z' fill='%236A2C5B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Marcellus&display=swap">
<style nonce="__NONCE__">
/* Layout: Aspen-style storefront. Transparent header over a full-bleed dark hero, sectioned page below, columned footer.
   Palette: Tyrian purple on cool marble, basalt in dark mode and in the hero. */
:root{
  --bg:#EEEFEC; --panel:#F7F7F4; --panel2:#E4E6E1; --ink:#14171A; --ink2:#566068; --line:#D0D3CD;
  --accent:#6A2C5B; --accent-ink:#FFFFFF; --accent-soft:#E7DAE3;
  --calm:#2F6F68; --stress:#A9701A; --crisis:#B3392F; --pos:#2E7A55; --neg:#B3392F; --blue:#3C5D88;
  --hero:#0E1113; --hero-ink:#ECE9E1; --hero-ink2:#A3AAB0; --hero-line:rgba(236,233,225,.16); --hero-accent:#D8A0CB;
  --display:'Marcellus','Trajan Pro','Times New Roman',serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --gut:clamp(16px,4vw,44px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1214; --panel:#161A1D; --panel2:#1F2427; --ink:#E9E7E0; --ink2:#9AA2A8; --line:#2B3236;
    --accent:#D296C6; --accent-ink:#1A0E17; --accent-soft:#2A1D27;
    --calm:#5DB5A9; --stress:#D9A441; --crisis:#E5695C; --pos:#5CBF8A; --neg:#E5695C; --blue:#8DB0DE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1214; --panel:#161A1D; --panel2:#1F2427; --ink:#E9E7E0; --ink2:#9AA2A8; --line:#2B3236;
  --accent:#D296C6; --accent-ink:#1A0E17; --accent-soft:#2A1D27;
  --calm:#5DB5A9; --stress:#D9A441; --crisis:#E5695C; --pos:#5CBF8A; --neg:#E5695C; --blue:#8DB0DE;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4{text-wrap:balance;margin:0}
h1,h2{font-family:var(--display);font-weight:400}
.wrap{width:100%;max-width:1180px;margin-inline:auto;padding-inline:var(--gut)}
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
code,.mono{font-family:var(--mono)}
code{font-size:.9em;background:var(--panel2);padding:1px 5px;border-radius:3px}

/* buttons */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:transparent;border:1px solid var(--line);border-radius:2px;padding:9px 16px;cursor:pointer;font:500 13.5px var(--body);text-decoration:none;letter-spacing:.02em;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.onhero{border-color:var(--hero-line);color:var(--hero-ink)}
.btn.onhero.p{background:var(--hero-ink);color:var(--hero);border-color:var(--hero-ink)}

/* header: transparent over the hero, solid once scrolled or off the home page */
.hdr{position:fixed;inset:0 0 auto 0;z-index:20;padding-top:env(safe-area-inset-top,0px);transition:background .25s,border-color .25s;border-bottom:1px solid transparent;color:var(--ink);background:var(--bg);border-bottom-color:var(--line)}
.hdr.over{background:transparent;border-bottom-color:transparent;color:var(--hero-ink)}
.hdr-in{display:flex;align-items:center;gap:28px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:400 20px/1 var(--display);letter-spacing:.26em}
.brand svg{width:26px;height:26px;flex:none}
.brand svg path{fill:var(--accent)} .hdr.over .brand svg path{fill:var(--hero-accent)}
.hdr.over .btn{color:var(--hero-ink);border-color:var(--hero-line)}
.nav{display:flex;gap:26px;margin-left:12px}
.nav a{text-decoration:none;font-size:14px;letter-spacing:.03em;padding:6px 0;border-bottom:1px solid transparent}
.nav a:hover,.nav a[aria-current]{border-bottom-color:currentColor}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.acct{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:14px;background:none;border:0;cursor:pointer;padding:6px 2px}
.acct svg{width:20px;height:20px}
.menu{display:none;background:none;border:0;padding:8px;cursor:pointer;color:inherit}
.menu svg{width:24px;height:24px}
@media (max-width:820px){
  .menu{display:block}
  .nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;margin:0;background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line);padding:6px var(--gut) 14px}
  .nav.open{display:flex}
  .nav a{padding:12px 0;border-bottom:1px solid var(--line)}
  .acct span{display:none}
}
main{flex:1;padding-top:68px}
main.home{padding-top:0}

/* hero */
.hero{position:relative;background:var(--hero);color:var(--hero-ink);overflow:hidden;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--hero) 0,rgba(14,17,19,.92) 40%,rgba(14,17,19,0) 80%),linear-gradient(0deg,var(--hero) 0,rgba(14,17,19,0) 26%)}
@media (max-width:820px){.hero::after{background:linear-gradient(180deg,var(--hero) 0,rgba(14,17,19,.94) 52%,rgba(14,17,19,.2) 100%)}}
.hero-in{padding-block:176px 92px;max-width:1180px;margin-inline:auto;padding-inline:var(--gut)}
.hero h1{font-size:clamp(36px,5.6vw,66px);line-height:1.04;letter-spacing:.01em;max-width:13em}
.hero p.lede{max-width:34em;font-size:17px;color:var(--hero-ink2);margin:22px 0 32px}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px}
.hero .cap{position:absolute;right:var(--gut);bottom:14px;font:400 11px var(--mono);color:var(--hero-ink2);max-width:46ch;text-align:right}
.facts{background:var(--hero);color:var(--hero-ink);border-top:1px solid var(--hero-line)}
.facts .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.fact{padding:22px 20px 24px 0;border-left:1px solid var(--hero-line);padding-left:20px}
.fact:first-child{border-left:0;padding-left:0}
.fact b{display:block;font:400 22px var(--display);letter-spacing:.03em;margin-bottom:2px}
.fact span{font-size:13px;color:var(--hero-ink2)}
@media (max-width:820px){.facts .wrap{grid-template-columns:1fr 1fr}.fact:nth-child(3){border-left:0;padding-left:0}.hero .cap{display:none}.hero-in{padding-block:132px 210px}}

/* sections */
.sec{padding-block:84px}
.sec.alt{background:var(--panel);border-block:1px solid var(--line)}
.sec-h{display:flex;flex-direction:column;gap:12px;max-width:44em;margin-bottom:38px}
.sec-h h2{font-size:clamp(28px,3.6vw,40px);line-height:1.1}
.sec-h p{margin:0;color:var(--ink2);font-size:16px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,238px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:10px;text-decoration:none;min-width:0;transition:border-color .15s,transform .15s}
.sec.alt .card{background:var(--bg)}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card svg.ic{width:30px;height:30px;color:var(--accent);fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card h3{font:400 21px var(--display);letter-spacing:.02em}
.card p{margin:0;color:var(--ink2);font-size:14px;flex:1}
.card .tag{font:400 11.5px var(--mono);color:var(--accent)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(28px,5vw,72px);align-items:center}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.split h2{font-size:clamp(28px,3.6vw,40px);line-height:1.1;margin:12px 0 16px}
.split p{color:var(--ink2);margin:0 0 14px;max-width:34em}
.ticks{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.ticks li{display:flex;gap:12px;align-items:baseline;font-size:14.5px}
.ticks li::before{content:"";flex:none;width:7px;height:7px;background:var(--accent);transform:translateY(-1px)}
.cols3{display:grid;gap:0;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);background:var(--bg)}
.cols3>div{padding:26px 26px 28px;border-left:1px solid var(--line);min-width:0}
.cols3>div:first-child{border-left:0}
.cols3 h3{font:400 22px var(--display);margin:8px 0 10px}
.cols3 p{margin:0;color:var(--ink2);font-size:14px}
@media (max-width:820px){.cols3{grid-template-columns:minmax(0,1fr)}.cols3>div{border-left:0;border-top:1px solid var(--line)}.cols3>div:first-child{border-top:0}}
pre.wrap{white-space:pre-wrap;word-break:break-all}
pre{margin:0;padding:14px 16px;background:var(--bg);border:1px solid var(--line);border-radius:2px;overflow:auto;font:12.5px/1.6 var(--mono);max-width:100%}
.sec.alt pre{background:var(--panel)}
.pre-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 6px;font:500 11.5px var(--mono);color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}

/* example transcript */
.tx{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec.alt .tx{background:var(--bg)}
.tx-note{font:400 11.5px var(--mono);color:var(--ink2)}

/* footer */
footer.ft{background:var(--hero);color:var(--hero-ink);margin-top:auto}
.ft-in{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:36px;padding-block:56px 36px}
.ft h4{font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--hero-ink2);margin-bottom:14px}
.ft a{display:block;text-decoration:none;color:var(--hero-ink);padding:4px 0;font-size:14px}
.ft a:hover{text-decoration:underline}
.ft .brand svg path{fill:var(--hero-accent)}
.ft p{color:var(--hero-ink2);font-size:13px;margin:14px 0 0;max-width:30em}
.ft-b{border-top:1px solid var(--hero-line);padding-block:16px;font-size:12px;color:var(--hero-ink2);display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}
@media (max-width:820px){.ft-in{grid-template-columns:1fr 1fr}.ft-in>div:first-child{grid-column:1/-1}}

/* page chrome for docs, models, security */
.page{padding-block:56px 84px}
.page-h{margin-bottom:34px;display:flex;flex-direction:column;gap:12px;max-width:48em}
.page-h h1{font-size:clamp(32px,4.4vw,48px);line-height:1.08}
.page-h p{margin:0;color:var(--ink2);font-size:16px}
.doc{display:grid;grid-template-columns:200px minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.toc{position:sticky;top:92px;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.toc a{text-decoration:none;color:var(--ink2);padding:5px 0 5px 12px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--ink);border-left-color:var(--accent)}
@media (max-width:900px){.doc{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.prose{min-width:0;max-width:760px}
.prose section{margin-bottom:46px;scroll-margin-top:90px}
.prose h2{font-size:28px;margin-bottom:14px}
.prose h3{font:600 15px var(--body);margin:24px 0 8px}
.prose p,.prose li{color:var(--ink);max-width:68ch}
.prose ul,.prose ol{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.prose .muted{color:var(--ink2)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 11px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.m,td code{font-family:var(--mono);font-size:12.5px}
td.r,th.r{text-align:right}
.callout{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--panel);padding:14px 16px;margin:16px 0;max-width:68ch}
.callout.warn{border-left-color:var(--stress)}
.callout b{display:block;margin-bottom:6px}
.callout ul{margin:0}
.pill{display:inline-block;font:500 11px var(--mono);padding:2px 8px;border-radius:10px;border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--pos);border-color:var(--pos)} .pill.no{color:var(--stress);border-color:var(--stress)}

/* sign in */
.signin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:calc(100vh - 68px)}
.signin-l{background:var(--hero);color:var(--hero-ink);padding:72px var(--gut);display:flex;flex-direction:column;justify-content:flex-end;gap:16px;position:relative;overflow:hidden;isolation:isolate}
.signin-l canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.55}
.signin-l h2{font-size:clamp(28px,3.4vw,40px);line-height:1.1;max-width:12em}
.signin-l p{color:var(--hero-ink2);max-width:30em;margin:0}
.signin-r{display:flex;align-items:center;padding:48px var(--gut)}
.form{width:100%;max-width:400px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.form h1{font-size:34px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--ink2);letter-spacing:.02em}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:10px 12px;width:100%;min-width:0;font-size:14.5px}
input.mono,textarea.mono,select.mono{font:13px var(--mono)}
.err{color:var(--neg);font-size:13.5px;min-height:1.4em}
.ok{color:var(--pos)}
@media (max-width:820px){.signin{grid-template-columns:minmax(0,1fr)}.signin-l{padding-block:40px 28px;min-height:0}.signin-l canvas{display:none}}

/* workspace */
.app{padding-block:22px 48px}
.apptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.apptabs a{padding:10px 14px;text-decoration:none;font-size:14px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.apptabs a:hover{color:var(--ink)}
.apptabs a[aria-current]{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.banner{border:1px solid var(--stress);color:var(--stress);padding:9px 14px;font-size:13.5px;margin-bottom:16px;background:var(--panel)}
.agent{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.hist{display:flex;flex-direction:column;gap:10px;position:sticky;top:92px;max-height:calc(100vh - 120px);overflow:auto}
.conv{display:flex;align-items:center;gap:4px;border-left:2px solid transparent}
.conv.cur{border-left-color:var(--accent);background:var(--panel)}
.conv button.t{flex:1;text-align:left;background:none;border:0;padding:8px 8px;cursor:pointer;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.conv button.x{background:none;border:0;color:var(--ink2);cursor:pointer;padding:6px 8px;font-size:16px;line-height:1}
.conv button.x:hover{color:var(--neg)}
.hist .none{font-size:13px;color:var(--ink2)}
@media (max-width:900px){.agent{grid-template-columns:minmax(0,1fr)}.hist{position:static;max-height:240px}}
.chat{min-width:0;display:flex;flex-direction:column;gap:14px}
.log{display:flex;flex-direction:column;gap:22px;min-height:340px}
.msg{display:flex;flex-direction:column;gap:8px;min-width:0}
.who{font:500 11px var(--mono);letter-spacing:.14em;color:var(--ink2)}
.msg.user .body{background:var(--panel2);padding:11px 14px;border-radius:2px;white-space:pre-wrap;max-width:46em;align-self:flex-start}
.msg.bot .who{color:var(--accent)}
.body p{margin:0 0 10px;max-width:70ch}.body p:last-child{margin-bottom:0}
.body h4{font:600 14px var(--body);margin:14px 0 6px}
.body ul,.body ol{margin:0 0 10px;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.body table{font-size:13px}
.tool{border:1px solid var(--line);background:var(--panel);border-radius:2px;min-width:0;max-width:760px}
.tool-h{display:flex;align-items:center;gap:10px;padding:9px 12px;font:500 12.5px var(--mono);flex-wrap:wrap}
.tool-h .nm{color:var(--ink)}
.tool-s{color:var(--ink2);margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink2);flex:none}
.dot.run{background:var(--stress);animation:pulse 1s ease-in-out infinite}
.dot.ok{background:var(--pos)} .dot.bad{background:var(--neg)}
@keyframes pulse{50%{opacity:.35}}
.tool-viz{padding:4px 12px 10px}
.tool details{border-top:1px solid var(--line);font-size:13px}
.tool summary{cursor:pointer;padding:8px 12px;color:var(--ink2);font:500 12px var(--mono)}
.tool details>div{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.tool pre{max-height:300px;font-size:12px}
.src{font:400 12px var(--mono);color:var(--ink2);line-height:1.5;word-break:break-word}
.composer{display:flex;gap:10px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px}
.composer textarea{resize:none;min-height:46px;max-height:180px}
.fine{margin:0;font-size:12.5px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:8px 12px;font-size:13.5px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}
.intro{border:1px solid var(--line);background:var(--panel);padding:22px;max-width:760px}
.intro h2{font-size:26px;margin-bottom:8px}
.intro p{margin:0;color:var(--ink2);max-width:60ch}
.working{font:400 12.5px var(--mono);color:var(--ink2)}
.bars{display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.bar-r{display:grid;grid-template-columns:minmax(64px,110px) minmax(0,1fr) 92px;gap:10px;align-items:center}
.bar-r .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-r .t{position:relative;height:12px;background:var(--panel2);border-radius:2px}
.bar-r .f{position:absolute;top:0;bottom:0;border-radius:2px}
.bar-r .z{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--ink2)}
.bar-r .v{font:400 12px var(--mono);text-align:right;white-space:nowrap}
.bars .ttl{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
.cv text{font:10.5px var(--mono);fill:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin:2px 0 4px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:6px;border-radius:2px;vertical-align:-1px}
.two{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}

/* ---------- api ---------- */
async function api(path,opt={}){
  const o={method:opt.method||'GET',headers:{'X-Requested-With':'aurelius'},credentials:'same-origin'};
  if(opt.body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(opt.body);}
  const r=await fetch(path,o);let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){
    const d=j&&j.detail;
    const msg=typeof d==='string'?d:Array.isArray(d)?d.map(x=>(x.loc?x.loc.filter(p=>p!=='body').join('.')+': ':'')+x.msg).join('; '):'Request failed ('+r.status+')';
    const e=new Error(msg);e.status=r.status;throw e;
  }
  return j;
}
async function streamChat(message,conversation_id,on){
  const r=await fetch('/v1/agent/chat',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'aurelius'},body:JSON.stringify({message,conversation_id})});
  if(!r.ok){let m='Request failed ('+r.status+')';try{const j=await r.json();m=typeof j.detail==='string'?j.detail:m}catch(e){}const e=new Error(m);e.status=r.status;throw e;}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){
    const {value,done}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n\n'))>=0){
      const ch=buf.slice(0,i);buf=buf.slice(i+2);
      const ev=/^event: (.*)$/m.exec(ch),da=/^data: (.*)$/m.exec(ch);
      if(ev&&da){try{on(ev[1],JSON.parse(da[1]));}catch(e){console.error(e);}}
    }
  }
}

/* ---------- chrome ---------- */
function renderChrome(){
  const route=currentRoute();
  $('#nav').innerHTML=NAV.map(n=>'<a href="'+n[1]+'"'+(location.hash.startsWith(n[1])?' aria-current="page"':'')+'>'+n[0]+'</a>').join('');

function setHeaderMode(){

}

/* ---------- router ---------- */
function currentRoute(){
  const p=(location.hash.replace(/^#\/?/,'')||'').split('/');
  if(!p[0])return{name:'home'};
  if(p[0]==='agent')return{name:'home',scroll:'agent'};
  if(p[0]==='models')return p[1]?{name:'model',id:p[1]}:{name:'models'};
  if(['docs','security','signin'].includes(p[0]))return{name:p[0]};
  if(p[0]==='app')return{name:'app',tab:p[1]||'agent'};
  return{name:'home'};
}
async function route(){
  const r=currentRoute(),v=$('#view');
  $('#nav').classList.remove('open');
  renderChrome();
  if(r.name!=='home'||!S.catalog)await ensureCatalog();
  const V={home:viewHome,models:viewModels,model:viewModel,docs:viewDocs,security:viewSecurity,signin:viewSignin,app:viewApp}[r.name];
  v.innerHTML='';
  await V(v,r);
  if(r.scroll){const e=document.getElementById(r.scroll);if(e)e.scrollIntoView();}else scrollTo(0,0);
  setHeaderMode();
}

/* hero illustration */
function heroCanvas(cv,opt){
  opt=opt||{};if(!cv)return;const ctx=cv.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd=(a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(11);
  const gauss=()=>{let u=0;while(!u)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2831853*rnd());};
  const N=300,P=[[.985,.012,.003],[.04,.94,.02],[.02,.07,.91]],mult=[.8,1.7,3.2],dr=[.0008,-.0004,-.003],st=[],cum=[];let s=0,c=0;
  for(let i=0;i<N;i++){const u=rnd();let a=0,ns=2;for(let k=0;k<3;k++){a+=P[s][k];if(u<a){ns=k;break;}}s=ns;st.push(s);c+=dr[s]+.0085*mult[s]*gauss();cum.push(c);}
  const col=['93,181,169','217,164,65','229,105,92'];
  function draw(p){
    const dpr=Math.min(devicePixelRatio||1,2),W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    const narrow=W<700,px=W*(opt.px||(narrow?.62:.70)),lo=Math.min(...cum),hi=Math.max(...cum),y0=H*(opt.y0!=null?opt.y0:(narrow?.76:.22)),y1=H*(opt.y1!=null?opt.y1:(narrow?.95:.74));
    const X=i=>i/(N-1)*px,Y=v=>y1-(v-lo)/(hi-lo)*(y1-y0)*0.9;
    ctx.strokeStyle='rgba(236,233,225,.07)';ctx.lineWidth=1;for(let k=1;k<6;k++){const y=H*k/6;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    const n=Math.max(2,Math.floor(p*N));
    for(let i=0,j=0;i<n;i++){if(i===n-1||st[i+1]!==st[j]){ctx.fillStyle='rgba('+col[st[j]]+','+(st[j]?(st[j]===1?.12:.2):.05)+')';ctx.fillRect(X(j),0,X(i+1)-X(j)+1,H);j=i+1;}}
    ctx.beginPath();for(let i=0;i<n;i++){const x=X(i),y=Y(cum[i]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.strokeStyle='rgba(236,233,225,.92)';ctx.lineWidth=1.6;ctx.lineJoin='round';ctx.stroke();
    const fa=Math.max(0,(p-.72)/.28);
    if(fa>0){
      const H2=60,sd=.0085*1.05,x0=px,x1=W*.975,y_0=Y(cum[N-1]),k=(lo,hi)=>hi-lo;const sc=(y1-y0)*0.9/(Math.max(...cum)-Math.min(...cum));
      const band=(z,al)=>{const g=ctx.createLinearGradient(x0,0,x1,0);g.addColorStop(0,'rgba(210,150,198,'+al*fa+')');g.addColorStop(1,'rgba(210,150,198,'+al*fa*.12+')');ctx.beginPath();for(let d=0;d<=H2;d++){const x=x0+(x1-x0)*d/H2,y=y_0-z*sd*Math.sqrt(d)*sc;d?ctx.lineTo(x,y):ctx.moveTo(x,y);}for(let d=H2;d>=0;d--){const x=x0+(x1-x0)*d/H2,y=y_0+z*sd*Math.sqrt(d)*sc;ctx.lineTo(x,y);}ctx.closePath();ctx.fillStyle=g;ctx.fill();};
      band(1.645,.16);band(.674,.26);
      ctx.beginPath();ctx.moveTo(x0,y_0);ctx.lineTo(x1,y_0);ctx.strokeStyle='rgba(216,160,203,'+.9*fa+')';ctx.lineWidth=1.4;ctx.stroke();
      ctx.fillStyle='rgba(163,170,176,'+fa+')';ctx.font='11px "IBM Plex Mono",monospace';ctx.fillText('forecast, 60 days',x0+8,Math.min(H-10,y_0+sc*sd*1.645*Math.sqrt(H2)+16));
    }
  }
  let t0=null;function tick(ts){if(!cv.isConnected)return;if(t0===null)t0=ts;const p=Math.min(1,(ts-t0)/1700),e=1-Math.pow(1-p,3);draw(e);if(p<1)requestAnimationFrame(tick);}
  if(reduce)draw(1);else requestAnimationFrame(tick);
  let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(cv.isConnected)draw(1);},120);});
}

function viewModels(v){

function schemaTable(sc){
  const req=new Set(sc.required||[]);
  const rows=Object.entries(sc.properties||{}).map(([k,p])=>{
    const b=p.anyOf?(p.anyOf.find(a=>a.type!=='null')||{}):p;
    let t=b.enum?'one of '+b.enum.join(', '):b.type==='array'?'array of '+((b.items&&b.items.type)||'any'):b.type==='object'?(b.additionalProperties?'object: ticker to number':'object'):(b.type||'any');
    if(b.minimum!==undefined||b.maximum!==undefined)t+=' ('+(b.minimum!==undefined?b.minimum:'')+' to '+(b.maximum!==undefined?b.maximum:'')+')';
    if(b.exclusiveMinimum!==undefined)t+=' (> '+b.exclusiveMinimum+')';
    const d=(p.default===undefined||p.default===null)?(req.has(k)?'required':'optional'):JSON.stringify(p.default);
    return '<tr><td class="m">'+esc(k)+'</td><td>'+esc(t)+'</td><td class="m">'+esc(d)+'</td><td>'+esc(p.description||'')+'</td></tr>';
  }).join('');
  return '<div class="tblwrap"><table><thead><tr><th>Field</th><th>Type</th><th>Default</th><th>Meaning</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4">No inputs.</td></tr>')+'</tbody></table></div>';
}
const curl=(name,body)=>'curl -s '+location.origin+'/v1/models/'+name+' \\\n  -H "Authorization: Bearer $AURELIUS_KEY" \\\n  -H "Content-Type: application/json" \\\n  -d \''+JSON.stringify(body).replace(/'/g,"'\\''")+'\'';

  '<div class="doc"><nav class="toc" aria-label="On this page"><a href="#m-method" data-s="m-method">Method</a><a href="#m-limits" data-s="m-limits">Limits</a><a href="#m-input" data-s="m-input">Inputs</a><a href="#m-ex" data-s="m-ex">Example</a></nav><div class="prose">'+

/* ---------- charts ---------- */
function niceTicks(lo,hi,n){const span=hi-lo;if(!(span>0))return[lo];const raw=span/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,st=(f<1.5?1:f<3?2:f<7?5:10)*p,out=[];for(let v=Math.ceil(lo/st-1e-9)*st;v<=hi+1e-9;v+=st)out.push(+v.toPrecision(10));return out;}
function chart(el,o){
  const W=Math.max(260,el.clientWidth||520),H=o.h||190,m={l:42,r:10,t:8,b:22},iw=W-m.l-m.r,ih=H-m.t-m.b,f=v=>v.toFixed(1);
  const xs=o.x,X=v=>m.l+(v-xs[0])/(xs[1]-xs[0])*iw;let lo=Infinity,hi=-Infinity;
  const sc=v=>{if(v<lo)lo=v;if(v>hi)hi=v;};(o.lines||[]).forEach(l=>l.y.forEach(sc));(o.polys||[]).forEach(p=>{p.lo.forEach(sc);p.hi.forEach(sc);});if(o.zero)sc(0);
  const pad=(hi-lo)*.06||1;lo-=pad;hi+=pad;const Y=v=>m.t+ih-(v-lo)/(hi-lo)*ih;let g='';
  (o.bands||[]).forEach(b=>g+='<rect x="'+f(X(b.x0))+'" y="'+m.t+'" width="'+f(Math.max(1,X(b.x1)-X(b.x0)))+'" height="'+ih+'" style="fill:var('+b.c+')" opacity="'+b.op+'"/>');
  niceTicks(lo,hi,4).forEach(t=>g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+f(Y(t))+'" y2="'+f(Y(t))+'" style="stroke:var(--line)"/><text x="'+(m.l-6)+'" y="'+f(Y(t)+3.5)+'" text-anchor="end">'+(o.yf?o.yf(t):t)+'</text>');
  niceTicks(xs[0],xs[1],Math.max(3,Math.floor(iw/110))).forEach(t=>g+='<text x="'+f(X(t))+'" y="'+(H-6)+'" text-anchor="middle">'+(o.xf?o.xf(t):t)+'</text>');
  if(o.zero&&lo<0&&hi>0)g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+f(Y(0))+'" y2="'+f(Y(0))+'" style="stroke:var(--ink2)" stroke-dasharray="2 3"/>';
  (o.polys||[]).forEach(p=>{let d='M'+f(X(p.x[0]))+','+f(Y(p.hi[0]));for(let i=1;i<p.x.length;i++)d+='L'+f(X(p.x[i]))+','+f(Y(p.hi[i]));for(let i=p.x.length-1;i>=0;i--)d+='L'+f(X(p.x[i]))+','+f(Y(p.lo[i]));g+='<path d="'+d+'Z" style="fill:var('+p.c+')" opacity="'+p.op+'"/>';});
  (o.lines||[]).forEach(l=>{let d='';l.y.forEach((y,i)=>{d+=(i?'L':'M')+f(X(l.x[i]))+','+f(Y(y));});g+='<path d="'+d+'" fill="none" style="stroke:var('+l.c+')" stroke-width="'+(l.w||1.5)+'" stroke-linejoin="round"/>';});
  el.innerHTML='<svg class="cv" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(o.label||'chart')+'">'+g+'</svg>';
}
const legend=a=>'<div class="legend">'+a.map(x=>'<span><i style="background:var('+x[0]+')"></i>'+esc(x[1])+'</span>').join('')+'</div>';
function barRow(label,val,note,signed,max){
  const m=max||1,w=Math.min(1,Math.abs(val)/m);
  const f=signed?'left:'+(val<0?(.5-w/2)*100:50)+'%;width:'+(w/2*100)+'%;background:var(--'+(val<0?'neg':'pos')+')':'left:0;width:'+(w*100)+'%;background:var(--accent)';
  return '<div class="bar-r"><div class="l" title="'+esc(label)+'">'+esc(label)+'</div><div class="t"><div class="f" style="'+f+'"></div>'+(signed?'<div class="z" style="left:50%"></div>':'')+'</div><div class="v">'+esc(note)+'</div></div>';
}
function renderViz(el,z){
  if(!z)return;
  if(z.type==='bars'){
    const max=Math.max(...z.rows.map(r=>Math.abs(r.value)),1e-9);
    el.innerHTML='<div class="bars"><div class="ttl">'+esc(z.title)+'</div>'+z.rows.map(r=>barRow(r.label,r.value,z.signed?(r.value*100).toFixed(1)+'%':(r.value*100).toFixed(1)+'% · '+r.note,z.signed,max)).join('')+'</div>';
  }else if(z.type==='regime'){
    const n=z.cum.length,cols=['--calm','--stress','--crisis'],bands=[];
    for(let i=0,j=0;i<n;i++){if(i===n-1||z.state[i+1]!==z.state[j]){bands.push({x0:j-.5,x1:i+.5,c:cols[z.state[j]],op:z.state[j]?.2:.1});j=i+1;}}
    el.innerHTML=legend(z.labels.map((l,i)=>[cols[i],l]))+'<div></div>';
    chart(el.lastChild,{h:180,x:[0,n-1],lines:[{x:z.cum.map((_,i)=>i),y:z.cum,c:'--ink'}],bands,yf:t=>t.toFixed(0)+'%',xf:t=>z.dates[Math.round(t)]?z.dates[Math.round(t)].slice(0,7):'',label:'Cumulative return shaded by regime'});
  }else if(z.type==='fan'){
    const b=z.bands,x=z.x;
    el.innerHTML=legend([['--accent','Median'],['--accent','25% to 75%'],['--blue','5% to 95%']])+'<div></div>';
    chart(el.lastChild,{h:180,x:[x[0],x[x.length-1]],zero:true,polys:[{x,lo:b['0.05'],hi:b['0.95'],c:'--blue',op:.18},{x,lo:b['0.25'],hi:b['0.75'],c:'--accent',op:.28}],lines:[{x,y:b['0.5'],c:'--accent',w:2}],yf:t=>t.toFixed(1)+'%',xf:t=>t,label:'Forecast fan of cumulative return'});
  }
}

/* ---------- markdown (escaped first, then a small safe subset) ---------- */
function inl(s){return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
function md(src){
  const L=esc(src).split('\n'),isL=l=>/^\s*([-*•]|\d+\.)\s+/.test(l),isT=l=>/^\s*\|.*\|\s*$/.test(l);let out='',i=0;
  while(i<L.length){
    const l=L[i];if(!l.trim()){i++;continue;}let m;
    if((m=/^(#{1,4})\s+(.*)$/.exec(l))){out+='<h4>'+inl(m[2])+'</h4>';i++;continue;}
    if(isT(l)&&i+1<L.length&&/^\s*\|[\s:|-]+\|\s*$/.test(L[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()),head=cells(l);i+=2;const rows=[];
      while(i<L.length&&isT(L[i])){rows.push(cells(L[i]));i++;}
      out+='<div class="tblwrap"><table><thead><tr>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue;
    }
    if(isL(l)){const ord=/^\s*\d+\./.test(l),it=[];while(i<L.length&&isL(L[i])){it.push(L[i].replace(/^\s*([-*•]|\d+\.)\s+/,''));i++;}out+=(ord?'<ol>':'<ul>')+it.map(x=>'<li>'+inl(x)+'</li>').join('')+(ord?'</ol>':'</ul>');continue;}
    const p=[L[i]];i++;while(i<L.length&&L[i].trim()&&!/^#{1,4}\s/.test(L[i])&&!isT(L[i])&&!isL(L[i])){p.push(L[i]);i++;}
    out+='<p>'+inl(p.join(' '))+'</p>';
  }
  return out;
}

function showIntro(){
  const names=(S.ports||[]).map(p=>p.name),sug=names.slice(0,2).map(n=>'Run a risk report on my '+n+' portfolio.').concat(SUGGEST).slice(0,6);
  $('#log').innerHTML='<div class="intro"><h2>What do you want to know?</h2><p>Ask in plain language. The agent picks the models, runs them on current data, and shows each call so you can check it.</p><div class="chips">'+sug.map(s=>'<button class="chip" type="button">'+esc(s)+'</button>').join('')+'</div></div>';
  $$('.chip').forEach(c=>c.onclick=()=>ask(c.textContent));
}
async function openConv(id){
  if(S.busy)return;S.cur=id;drawConvs();
  const c=await api('/v1/conversations/'+id),log=$('#log');log.innerHTML='';
  for(const m of c.messages){
    if(m.role==='user'){log.appendChild(userMsg(m.text));continue;}
    const b=botMsg();
    if(m.text)b.text(m.text);
    (m.tools||[]).forEach(t=>{const card=b.tool(t);let res=null;try{res=JSON.parse(t.result);}catch(e){}card.done({ok:t.ok!==false,ms:null,result:res||{raw:String(t.result||'')}});});
    log.appendChild(b.el);
  }
  log.lastChild&&log.lastChild.scrollIntoView({block:'end'});
}
function userMsg(t){const d=document.createElement('div');d.className='msg user';d.innerHTML='<span class="who">YOU</span><div class="body"></div>';$('.body',d).textContent=t;return d;}
function botMsg(){
  const el=document.createElement('div');el.className='msg bot';el.innerHTML='<span class="who">AURELIUS</span>';const tools={};
  return{el,
    text(t){const d=document.createElement('div');d.className='body';d.innerHTML=md(t);el.appendChild(d);},
    working(on){let w=$('.working',el);if(on&&!w){w=document.createElement('div');w.className='working';w.textContent='Working…';el.appendChild(w);}else if(!on&&w)w.remove();else if(on&&w)el.appendChild(w);},
    tool(call){
      const d=document.createElement('div');d.className='tool';
      d.innerHTML='<div class="tool-h"><span class="dot run"></span><span class="nm"></span><span class="tool-s">running…</span></div><div class="tool-viz"></div><details><summary>Inputs and result</summary><div><pre class="in"></pre><div class="src"></div><pre class="out"></pre></div></details>';
      $('.nm',d).textContent=call.name;$('.in',d).textContent=JSON.stringify(call.input,null,2);$('.out',d).textContent='…';
      el.appendChild(d);
      const api2={done(r){
        $('.dot',d).className='dot '+(r.ok?'ok':'bad');$('.tool-s',d).textContent=(r.ok?'':'error · ')+(r.ms!=null?r.ms+' ms':'');
        const res=r.result||{},dt=res.data;
        if(dt&&dt.window)$('.src',d).textContent='Source: '+dt.source+' · as of '+dt.asof+' · '+dt.window.start+' to '+dt.window.end+' · '+dt.window.n_returns+' daily returns · '+(dt.tickers||[]).join(', ')+(dt.dropped&&Object.keys(dt.dropped).length?' · dropped: '+Object.keys(dt.dropped).join(', '):'')+((dt.notes||[]).length?' · '+dt.notes.join(' '):'');
        else if(!r.ok)$('.src',d).textContent='This call failed. The agent was told why and may retry.';
        let s=JSON.stringify(res,null,2);if(s.length>40000)s=s.slice(0,40000)+'\n… (truncated for display)';$('.out',d).textContent=s;
        if(r.ok)renderViz($('.tool-viz',d),r.viz);
        if(!r.ok)$('details',d).open=true;
      }};
      tools[call.id]=api2;return api2;
    },
    get(id){return tools[id];}};
}
async function ask(text){
  if(S.busy)return;if(S.health&&!S.health.agent_enabled){$('#banner').innerHTML='<div class="banner">The agent is not enabled on this server (no ANTHROPIC_API_KEY).</div>';return;}
  S.busy=true;$('#send').disabled=true;const log=$('#log');if($('.intro',log))log.innerHTML='';
  log.appendChild(userMsg(text));const bot=botMsg();log.appendChild(bot.el);bot.working(true);bot.el.scrollIntoView({block:'end'});
  try{
    await streamChat(text,S.cur,(ev,d)=>{
      if(ev==='conversation'){if(!S.cur){S.cur=d.id;S.convs.unshift({id:d.id,title:d.title});drawConvs();}}
      else if(ev==='text'){bot.working(false);bot.text(d.text);bot.working(true);}
      else if(ev==='tool_call'){bot.working(false);bot.tool(d);bot.working(true);}
      else if(ev==='tool_result'){const t=bot.get(d.id);if(t)t.done(d);}
      else if(ev==='error'){bot.working(false);const e=document.createElement('div');e.className='banner';e.textContent=d.message;bot.el.appendChild(e);}
      else if(ev==='done'){bot.working(false);}
      bot.el.scrollIntoView({block:'end'});
    });
  }catch(e){bot.working(false);const x=document.createElement('div');x.className='banner';x.textContent=e.message;bot.el.appendChild(x);if(e.status===401){S.me=null;renderChrome();location.hash='#/signin';}}
  bot.working(false);S.busy=false;const sb=$('#send');if(sb)sb.disabled=false;
  try{S.convs=await api('/v1/conversations');drawConvs();}catch(e){}
}

/* portfolios */
APP.portfolios=async function(body){
  let list=await api('/v1/portfolios'),cur=null;
  const blank=()=>({name:'',nav_usd:10000000,weights:{SPY:.5,TLT:.3,GLD:.2},isNew:true});
  const draw=()=>{
    const p=cur;
    body.innerHTML='<div class="two"><div><div class="list">'+(list.length?list.map(x=>'<button type="button" data-n="'+esc(x.name)+'" class="'+(p&&!p.isNew&&p.name===x.name?'cur':'')+'"><b>'+esc(x.name)+'</b><span>$'+(x.nav_usd/1e6).toFixed(1)+'M · '+Object.keys(x.weights).length+' positions</span></button>').join(''):'<div style="padding:14px" class="fine">No saved portfolios yet.</div>')+'</div><div style="margin-top:12px"><button class="btn" id="np" type="button">New portfolio</button></div></div>'+
    '<div>'+(p?'<div class="panel"><div class="row"><div class="field"><label for="pn">Name</label><input id="pn" type="text" maxlength="60" value="'+esc(p.name)+'"'+(p.isNew?'':' readonly')+'></div><div class="field"><label for="pv">NAV (US dollars)</label><input id="pv" type="number" min="1" step="1000000" value="'+p.nav_usd+'"></div></div>'+
    '<div class="tblwrap" style="border:0;margin:0"><table class="pos-t"><thead><tr><th>Ticker</th><th>Weight %</th><th></th></tr></thead><tbody id="pr"></tbody></table></div><div class="row"><button class="btn sm" id="ap" type="button">Add position</button><span class="totals" id="tt"></span></div><div class="err" id="pe" role="alert"></div>'+
    '<div class="row"><button class="btn p" id="ps" type="button">Save</button>'+(p.isNew?'':'<button class="btn" id="pa" type="button">Ask the agent about it</button><button class="btn" id="pd" type="button">Delete</button>')+'</div><p class="fine">Weights are percentages of NAV. Weights under 100% leave the remainder in cash. Positions you save here are visible only to your account.</p></div>':'<div class="intro"><h2>Saved portfolios</h2><p>Save a book once, then refer to it by name in the agent, the playground and the API: "Run a risk report on Core Book".</p></div>')+'</div></div>';
    $$('[data-n]',body).forEach(b=>b.onclick=()=>{const x=list.find(q=>q.name===b.dataset.n);cur=JSON.parse(JSON.stringify(x));draw();});
    $('#np').onclick=()=>{cur=blank();draw();};
    if(!p)return;
    const rows=$('#pr'),tt=$('#tt');
    const addRow=(t,w)=>{const tr=document.createElement('tr');tr.innerHTML='<td><input type="text" class="t mono" maxlength="15" aria-label="Ticker" style="width:110px;text-transform:uppercase"></td><td><input type="number" class="w mono" step="0.5" aria-label="Weight percent" style="width:110px"></td><td><button class="btn sm" type="button" aria-label="Remove position">×</button></td>';$('.t',tr).value=t;$('.w',tr).value=w;$('button',tr).onclick=()=>{tr.remove();tot();};$$('input',tr).forEach(i=>i.oninput=tot);rows.appendChild(tr);};
    const read=()=>{const o={};$$('tr',rows).forEach(tr=>{const t=$('.t',tr).value.trim().toUpperCase(),w=parseFloat($('.w',tr).value);if(t&&!isNaN(w))o[t]=w/100;});return o;};
    const tot=()=>{const w=read(),v=Object.values(w),net=v.reduce((a,b)=>a+b,0),gr=v.reduce((a,b)=>a+Math.abs(b),0);tt.textContent='Gross '+(gr*100).toFixed(1)+'% · Net '+(net*100).toFixed(1)+'% · Cash '+((1-net)*100).toFixed(1)+'%';};
    Object.entries(p.weights).forEach(([t,w])=>addRow(t,+(w*100).toFixed(4)));tot();
    $('#ap').onclick=()=>{addRow('','');};
    $('#ps').onclick=async()=>{
      const er=$('#pe');er.textContent='';const name=$('#pn').value.trim(),w=read();
      if(!name){er.textContent='Give the portfolio a name.';return;}if(!Object.keys(w).length){er.textContent='Add at least one position.';return;}
      try{const saved=await api('/v1/portfolios/'+encodeURIComponent(name),{method:'PUT',body:{weights:w,nav_usd:parseFloat($('#pv').value)||1e6}});list=await api('/v1/portfolios');cur=JSON.parse(JSON.stringify(saved));draw();}
      catch(x){er.textContent=x.message;}
    };
    const pa=$('#pa');if(pa)pa.onclick=()=>{sessionStorageSet('aurelius_prefill','Run a risk report on my '+p.name+' portfolio, then tell me which regime it is in.');location.hash='#/app/agent';};
    const pd=$('#pd');if(pd)pd.onclick=async()=>{if(pd.dataset.sure!=='1'){pd.dataset.sure='1';pd.textContent='Click again to delete';return;}try{await api('/v1/portfolios/'+encodeURIComponent(p.name),{method:'DELETE'});list=await api('/v1/portfolios');cur=null;draw();}catch(x){$('#pe').textContent=x.message;}};
  };
  cur=list[0]?JSON.parse(JSON.stringify(list[0])):blank();draw();
};

/* playground */
APP.playground=async function(body){
  await ensureCatalog();const ms=S.catalog?S.catalog.models:[];
  body.innerHTML='<div class="panel" style="max-width:980px"><div class="row"><div class="field" style="max-width:320px"><label for="pm">Model</label><select id="pm">'+ms.map(m=>'<option value="'+esc(m.name)+'">'+esc(m.title)+' · '+esc(m.name)+'</option>').join('')+'</select></div><button class="btn p" id="pr" type="button">Run</button><span class="totals" id="ps"></span></div>'+
  '<div class="field"><label for="pj">Request body (JSON)</label><textarea id="pj" class="mono" rows="10" spellcheck="false"></textarea></div><div class="err" id="pe" role="alert"></div>'+
  '<div><div class="pre-h"><span>Same call from code</span><button class="btn sm" id="pc" type="button">Copy</button></div><pre class="wrap" id="pcurl"></pre></div>'+
  '<div><div class="pre-h"><span>Response</span></div><pre id="po" style="max-height:480px;min-height:60px">Run a model to see its response.</pre></div><p class="fine">The playground uses your session. From code, use an API key.</p></div>';
  const sel=$('#pm'),ta=$('#pj');
  const setEx=()=>{const m=ms.find(x=>x.name===sel.value);ta.value=JSON.stringify(m.example,null,2);curlUp();};
  const curlUp=()=>{let b;try{b=JSON.parse(ta.value);}catch(e){b={};}$('#pcurl').textContent=curl(sel.value,b);};
  sel.onchange=setEx;ta.oninput=curlUp;$('#pc').onclick=e=>copy($('#pcurl').textContent,e.target);setEx();
  $('#pr').onclick=async()=>{
    const er=$('#pe'),out=$('#po'),b=$('#pr');er.textContent='';let j;
    try{j=JSON.parse(ta.value);}catch(e){er.textContent='That is not valid JSON: '+e.message;return;}
    b.disabled=true;out.textContent='Running…';const t0=performance.now();
    try{const r=await api('/v1/models/'+sel.value,{method:'POST',body:j});out.textContent=JSON.stringify(r.result,null,2);$('#ps').textContent='200 · '+r.elapsed_ms+' ms server · '+Math.round(performance.now()-t0)+' ms total';}
    catch(x){out.textContent='';er.textContent=x.status+' · '+x.message;$('#ps').textContent='';}
    b.disabled=false;
  };
};

/* api keys */
APP.keys=async function(body){
  const draw=async(fresh)=>{
    const keys=await api('/v1/keys');
    body.innerHTML='<div class="panel" style="max-width:860px"><div><h2 style="font-size:26px">API keys</h2><p class="fine" style="margin-top:6px">Keys act as your account: they can run models and read your saved portfolios. Store them in a secrets manager. Only a hash is kept here.</p></div>'+
    (fresh?'<div class="keybox"><b>Copy this key now. It will not be shown again.</b><code id="nk"></code><div><button class="btn sm" id="ck" type="button">Copy key</button></div></div>':'')+
    '<div class="row"><div class="field" style="max-width:320px"><label for="kn">Name</label><input id="kn" type="text" maxlength="60" placeholder="Risk desk notebook"></div><button class="btn p" id="kc" type="button">Create key</button></div><div class="err" id="ke" role="alert"></div>'+
    '<div class="tblwrap" style="margin:0"><table><thead><tr><th>Name</th><th>Prefix</th><th>Created</th><th>Last used</th><th></th></tr></thead><tbody>'+(keys.length?keys.map(k=>'<tr><td>'+esc(k.name)+'</td><td class="m">'+esc(k.prefix)+'…</td><td>'+esc(fmtTs(k.created_at))+'</td><td>'+esc(fmtTs(k.last_used))+'</td><td><button class="btn sm" data-r="'+k.id+'" type="button">Revoke</button></td></tr>').join(''):'<tr><td colspan="5" class="fine">No active keys.</td></tr>')+'</tbody></table></div></div>';
    if(fresh){$('#nk').textContent=fresh;$('#ck').onclick=e=>copy(fresh,e.target);}
    $('#kc').onclick=async()=>{const n=$('#kn').value.trim();if(!n){$('#ke').textContent='Name the key so you can tell it apart later.';return;}try{const r=await api('/v1/keys',{method:'POST',body:{name:n}});await draw(r.key);}catch(x){$('#ke').textContent=x.message;}};
    $$('[data-r]').forEach(b=>b.onclick=async()=>{if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Confirm';return;}try{await api('/v1/keys/'+b.dataset.r,{method:'DELETE'});await draw();}catch(x){$('#ke').textContent=x.message;}});
  };
  await draw();
};

/* activity */
APP.activity=async function(body){
  const rows=await api('/v1/audit'),admin=S.me&&S.me.role==='admin';
  body.innerHTML='<div class="panel"><div><h2 style="font-size:26px">Activity</h2><p class="fine" style="margin-top:6px">'+(admin?'Recent events across all accounts.':'Your recent events.')+' Portfolio contents are never recorded.</p></div><div class="tblwrap" style="margin:0"><table><thead><tr><th>Time</th>'+(admin?'<th>Account</th>':'')+'<th>Event</th><th>Detail</th></tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr><td class="m">'+esc(fmtTs(r.ts))+'</td>'+(admin?'<td>'+esc(r.email||'—')+'</td>':'')+'<td>'+esc(r.event)+'</td><td class="m">'+esc(r.detail)+'</td></tr>').join(''):'<tr><td colspan="4" class="fine">Nothing yet.</td></tr>')+'</tbody></table></div></div>';
};

/* ---------- boot ---------- */
(async function boot(){
  try{S.health=await api('/v1/health');}catch(e){S.health=null;}
  try{S.me=await api('/v1/me');}catch(e){S.me=null;}
  await ensureCatalog();
  addEventListener('hashchange',route);
  route();
})();
</script>
